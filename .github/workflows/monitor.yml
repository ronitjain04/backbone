name: Monitor live Backbone
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backbone-live-monitor
  cancel-in-progress: true
jobs:
  live:
    name: Read-only live configuration and provider probe
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SITE_URL: https://backbone-study.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Probe both courses and a contextual follow-up with bounded retries
        run: python -m scripts.monitor
