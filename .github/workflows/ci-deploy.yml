name: Test and deploy Backbone

on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backbone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/site/package-lock.json
      - run: npm ci
        working-directory: website/site
      - run: npm test
        working-directory: website/site
      - run: npm run build
        working-directory: website/site
      - run: npm run build:static
        working-directory: website/site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vercel-public
          path: website/public/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend and deployment tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: backbone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/backbone_test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/backend/requirements.txt
      - run: python -m pip install -r website/backend/requirements.txt pytest
      - run: python -m pytest website/backend/tests scripts/tests -q

  deploy:
    name: Deploy production and verify live answers
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://backbone-study.vercel.app
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SITE_URL: https://backbone-study.vercel.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check deployment configuration and current main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID BACKEND_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions setting: $name"
              exit 1
            fi
          done
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::A newer main commit exists; allow its workflow to deploy."
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.15.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: vercel-public
          path: website/public
      - name: Deploy tested website and backend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --cwd website --env BACKBONE_COMMIT="$GITHUB_SHA"
      - name: Verify backend revision and both courses
        run: python scripts/deploy.py backend
      - name: Verify public site, both courses, and a follow-up
        run: python scripts/deploy.py smoke
