name: Test and deploy Backbone

on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backbone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/site/package-lock.json
      - run: npm ci
        working-directory: website/site
      - run: npm test
        working-directory: website/site
      - run: npm run build
        working-directory: website/site
      - name: Package Cloudflare Pages advanced-mode Worker
        run: |
          node --check website/site/dist/server/index.js
          mkdir -p website/site/dist/pages
          cp website/site/dist/server/index.js website/site/dist/pages/_worker.js
          cp website/site/index.html website/site/dist/pages/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-pages
          path: website/site/dist/pages/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend and deployment tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: website/backend/requirements.txt
      - run: python -m pip install -r website/backend/requirements.txt pytest
      - run: python -m pytest website/backend/tests scripts/tests -q

  deploy:
    name: Deploy production and verify live answers
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://backbone-study.pages.dev
    env:
      BACKEND_URL: https://backbone-demo-api.onrender.com
      SITE_URL: https://backbone-study.pages.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check deployment configuration and current main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions setting: $name"
              exit 1
            fi
          done
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::A newer main commit exists; allow its workflow to deploy."
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Deploy tested backend commit and wait for readiness
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: python scripts/deploy.py render
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cloudflare-pages
          path: pages
      - name: Deploy tested frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages --project-name=backbone-study --branch=main --commit-hash=${{ github.sha }}
      - name: Verify public site, both courses, and a follow-up
        run: python scripts/deploy.py smoke
