name: Test and deploy Backbone

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backbone-verify-${{ github.event.pull_request.number || github.ref }}
  # PR checks can be superseded; never cancel a workflow that may be promoting main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality, workflow, and dependency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'website/backend/requirements*.txt'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/site/package-lock.json
      - run: python -m pip install -r website/backend/requirements.txt -r website/backend/requirements-dev.txt
      - run: npm ci
        working-directory: website/site
      - run: ruff check .
      - run: npm run lint
        working-directory: website/site
      - name: Validate GitHub workflows with checksum-pinned actionlint
        run: |
          curl --fail --silent --show-error --location --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Audit production Python dependencies
        run: pip-audit -r website/backend/requirements.txt
      - name: Audit production browser dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: website/site

  frontend:
    name: Frontend tests and static build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/site/package-lock.json
      - run: npm ci
        working-directory: website/site
      # Includes the retained live Sites Worker compatibility tests.
      - run: npm test
        working-directory: website/site
      - run: npm run build
        working-directory: website/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-public
          path: website/public/
          if-no-files-found: error
          retention-days: 3

  backend:
    name: Backend, deployment, and migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: backbone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/backbone_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'website/backend/requirements*.txt'
      - run: python -m pip install -r website/backend/requirements.txt -r website/backend/requirements-dev.txt
      - name: Upgrade a populated old schema and verify rerun/data preservation
        run: python -m pytest website/backend/tests/test_practice_migrations.py -q
      - name: Backend, release safety, and classroom integration tests
        run: python -m pytest website/backend/tests scripts/tests --ignore=website/backend/tests/test_practice_migrations.py -q

  browser:
    name: Full-stack Chromium smoke
    needs: [frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: backbone_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/backbone_browser
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'website/backend/requirements*.txt'
      - run: python -m pip install -r website/backend/requirements.txt -r website/backend/requirements-dev.txt
      - name: Test the exact frontend artifact used for release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-public
          path: website/public
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Synthetic student, teacher, replay, and mobile flows
        run: python -m pytest tests/browser --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output test-results -q
      - name: Synthetic browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  deploy:
    name: Verify candidate then promote production
    needs: [quality, frontend, backend, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Never cancel a release already promoting. Stale queued commits are rejected by release.py.
    concurrency:
      group: backbone-production-release
      cancel-in-progress: false
    environment:
      name: production
      url: https://backbone-study.vercel.app
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE_URL: https://backbone-study.vercel.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate deployment settings without printing credentials
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions setting: $name"
              exit 1
            fi
          done
      - run: npm install --global vercel@65.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-public
          path: website/public
      - name: Stage, verify exact revision and saved practice, then promote
        run: python -m scripts.release
