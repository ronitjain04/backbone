version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      action-updates:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /website/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
